[project]
name = "paperv4-tabpfn-comparison"
version = "0.1.0"
description = "TabPFN-guided causal delta forecasting for water quality"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=2.1,<2.3",
    "pandas>=2.2,<3",
    "tabpfn==8.1.0",
    "tabpfn-time-series==1.2.0",
    "xlrd>=2.0.2",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
